name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar llave de firma
        id: llave
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Falta el secreto KEYSTORE_B64: agrega la llave de firma en Settings > Secrets > Actions y vuelve a ejecutar."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        if: steps.llave.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build-log.txt

      - name: Publicar registro si falla
        if: failure() && steps.llave.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Registro de error ${{ github.run_number }}
          prerelease: true
          files: build-log.txt

      - name: Renombrar APK
        if: steps.llave.outputs.ok == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Zerkalo.apk

      - name: Publicar en Releases
        if: steps.llave.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zerkalo 1.0.${{ github.run_number }}
          body: APK lista para instalar. Si ya tienes Zerkalo, se actualiza sola.
          files: Zerkalo.apk
