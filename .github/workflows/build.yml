name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Incluir el catálogo más reciente (si existe)
        run: |
          mkdir -p app/src/main/assets/catalogo
          for l in es en fr pt de it ru ja la; do
            curl -fsSL -o app/src/main/assets/catalogo/gutenberg-$l.json.gz \
              https://github.com/sebastianbalbinu/Zerkalo/releases/download/catalogo/gutenberg-$l.json.gz || rm -f app/src/main/assets/catalogo/gutenberg-$l.json.gz
          done
          ls -la app/src/main/assets/catalogo

      # Las fuentes recortadas se guardan entre compilaciones (antes tardaban 7 minutos cada vez).
      - name: Recuperar fuentes guardadas
        id: fuentes
        uses: actions/cache@v4
        with:
          path: fuentes-cache
          key: fuentes-${{ hashFiles('.github/scripts/fuentes.sh') }}

      - name: Incluir fuentes libres de lectura
        run: |
          if [ "${{ steps.fuentes.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/fuentes.sh
            mkdir -p fuentes-cache && cp app/src/main/assets/fonts/*.ttf fuentes-cache/
          else
            cp -n fuentes-cache/*.ttf app/src/main/assets/fonts/
          fi
          ls app/src/main/assets/fonts | wc -l

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build-log.txt

      - name: Publicar registro si falla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Registro de error ${{ github.run_number }}
          prerelease: true
          files: build-log.txt

      - name: Renombrar APK
        run: |
          D=app/build/outputs/apk/release
          ls -la $D
          cp $D/app-arm64-v8a-release.apk Zerkalo.apk          # la de casi todos los teléfonos de hoy
          cp $D/app-armeabi-v7a-release.apk Zerkalo-armv7.apk  # teléfonos viejos de 32 bits
          cp $D/app-x86_64-release.apk Zerkalo-x86_64.apk      # emuladores de prueba
          ls -la Zerkalo*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Zerkalo*.apk

  probar:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          heap-size: 1024M
          force-avd-creation: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash .github/scripts/probar.sh

      - name: Renombrar capturas
        if: always()
        run: |
          for f in shot1.png shot2.png shot3.png shot4.png logcat.txt metricas.txt; do [ -f "$f" ] && mv "$f" "api${{ matrix.api }}-$f"; done; ls

      - name: Publicar capturas de la prueba
        if: always()
        # Las tres pruebas publican a la vez; si GitHub choca al crear la versión, no es un fallo de la app.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: Prueba ${{ github.run_number }}
          prerelease: true
          files: |
            api${{ matrix.api }}-shot1.png
            api${{ matrix.api }}-shot2.png
            api${{ matrix.api }}-shot3.png
            api${{ matrix.api }}-shot4.png
            api${{ matrix.api }}-logcat.txt
            api${{ matrix.api }}-metricas.txt

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publicar en Releases (solo si todas las pruebas pasaron)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zerkalo 1.0.${{ github.run_number }}
          make_latest: true
          body: "Zerkalo nativa: lector EPUB con Readium, probado en emuladores Android 14, 15 y 16. Si ya tienes Zerkalo, se actualiza sola."
          files: |
            Zerkalo.apk
            Zerkalo-armv7.apk
