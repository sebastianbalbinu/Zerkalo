<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<title>Zerkalo</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Tema antes de pintar, para que no parpadee.
  (function () {
    var t = 'system'; try { t = localStorage.getItem('zk-theme') || 'system'; } catch (e) {}
    var sys = window.ZerkaloNative ? window.ZerkaloNative.systemDark() : matchMedia('(prefers-color-scheme: dark)').matches;
    if (t === 'dark' || t === 'oled' || (t === 'system' && sys)) document.documentElement.classList.add('dark');
    if (t === 'oled') document.documentElement.classList.add('oled');
    // Cualquier error queda registrado en Android, por si algo no abre.
    var N = window.ZerkaloNative;
    function log(m) { try { N && N.log(String(m).slice(0, 300)); } catch (e) {} }
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && (e.target.src || e.target.href)) log('No cargó ' + (e.target.src || e.target.href));
      else log((e.message || 'Error') + ' · ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) { log('Promesa: ' + (e.reason && (e.reason.message || e.reason))); });
  })();
</script>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
